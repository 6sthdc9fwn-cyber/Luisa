<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Finanze Personali</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="tema.js"></script>
<script src="icone.js"></script>
</head>
<body>

<script src="shell.js"></script>

<main id="main">
  <div class="page-header">
    <h2 id="dash-title">Dashboard</h2>
    <p>Panoramica finanziaria annuale</p>
  </div>
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="chart-row">
    <div class="chart-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h4 style="margin:0"><span data-ic="report" data-s="18"></span> Andamento mensile</h4>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="dash-filtro-tipo" title="Tipo filtro grafico" onchange="onChartFilterChange()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;outline:none;font-family:inherit;color:var(--text2)">
            <option value="totale">Entrate vs Spese</option>
            <option value="gruppo">Per gruppo...</option>
            <option value="categoria">Per categoria...</option>
          </select>
          <select id="dash-filtro-valore" title="Valore filtro" onchange="onChartFilterChange()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;outline:none;font-family:inherit;color:var(--text2);display:none"></select>
        </div>
      </div>
      <div id="chart-monthly"></div>
      <div style="display:flex;gap:4px;justify-content:space-between;margin-top:2px" id="chart-labels"></div>
    </div>
    <div class="chart-box">
      <h4><span data-ic="pie" data-s="18"></span> Spese per gruppo</h4>
      <div id="chart-donut"></div>
    </div>
  </div>
  <div class="chart-row">
    <div class="chart-box">
      <h4><span data-ic="trophy" data-s="18"></span> Top categorie spese</h4>
      <div class="bar-chart" id="chart-top-cat"></div>
    </div>
    <div class="chart-box">
      <h4><span data-ic="briefcase" data-s="18"></span> Patrimonio attuale</h4>
      <div id="patrimonio-box"></div>
    </div>
  </div>
  <div class="card card-pad" style="margin-top:16px">
    <h4 style="font-size:14px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px"><span data-ic="calendarDays" data-s="18"></span> Saldi mensili</h4>
    <div class="table-wrap"><table><thead id="saldi-head"></thead><tbody id="saldi-body"></tbody></table></div>
  </div>
</main>

<div id="confirm-backdrop">
  <div id="confirm-box">
    <h4 id="confirm-title">Conferma</h4>
    <p id="confirm-msg"></p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="confirmReject()">Annulla</button>
      <button class="btn btn-danger" id="confirm-ok-btn" onclick="confirmAccept()">Elimina</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>

<script src="db.js"></script>
<script>
const PAGE_ID = 'dashboard';

function renderCurrentPage() { renderDashboard(); }

function getChartMonthData(m) {
  const g = DB.global.personalizzazioni?.grafico || {};
  const mt = monthlyTotals(m);
  if (g.filtroTipo === 'gruppo') {
    const grp = g.filtroValore;
    const val = txAnno().filter(t=>t.mese===m&&txConfirmed(t)&&t.tipo==='SPESE'&&getGruppoSpesa(t.categoria)===grp).reduce((s,t)=>s+t.importo,0);
    return {v1:null, v2:val, lbl2:`${grp} — ${MESI[m-1]}: ${fmtEur(val)}`};
  }
  if (g.filtroTipo === 'categoria') {
    const cat = g.filtroValore;
    const val = txAnno().filter(t=>t.mese===m&&txConfirmed(t)&&t.categoria===cat).reduce((s,t)=>s+t.importo,0);
    return {v1:null, v2:val, lbl2:`${cat} — ${MESI[m-1]}: ${fmtEur(val)}`};
  }
  return {v1:mt.reddito, v2:mt.spese+mt.debiti, lbl1:`Entrate ${MESI[m-1]}: ${fmtEur(mt.reddito)}`, lbl2:`Uscite ${MESI[m-1]}: ${fmtEur(mt.spese+mt.debiti)}`};
}

function fmtK(v) {
  if (Math.abs(v) >= 10000) return (v/1000).toFixed(1)+'k';
  if (Math.abs(v) >= 1000)  return (v/1000).toFixed(2)+'k';
  return fmt(v);
}

function renderMonthlyChart() {
  const g = DB.global.personalizzazioni?.grafico || {};
  const monthlyTipo = g.tipo || 'barre';
  const col1 = coloreLeggibile(g.colore1) || 'var(--reddito)';
  const col2 = coloreLeggibile(g.colore2) || (g.filtroTipo==='gruppo' ? getGruppoColore(g.filtroValore) : g.filtroTipo==='categoria' ? 'var(--debiti)' : 'var(--spese)');
  const data = Array.from({length:12}, (_,i) => getChartMonthData(i+1));
  const hasDual = data[0].v1 !== null;
  const d1 = hasDual ? data.map(d=>d.v1||0) : null;
  const d2 = data.map(d=>d.v2||0);
  const n = 12;
  const maxVal = Math.max(...(d1||[]), ...d2, 1);
  const H = 160, W = 600, showLabels = true;
  const PAD = {l:8, r:8, t: Math.max(18, Math.round(H*.14)), b:22};
  const plotH = H - PAD.t - PAD.b, plotW = W - PAD.l - PAD.r;

  let leg = `<div style="display:flex;gap:12px;margin-bottom:4px;font-size:11px;color:var(--text2)">`;
  if (hasDual) {
    leg += `<span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:${col1};border-radius:2px"></span>Entrate</span>`;
    leg += `<span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:${col2};border-radius:2px"></span>Spese</span>`;
  } else {
    leg += `<span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:8px;height:8px;background:${col2};border-radius:2px"></span>${g.filtroValore||'Importo'}</span>`;
  }

  let svgContent = '';
  if (monthlyTipo === 'linee') {
    const px = i => PAD.l + (n>1 ? (i/(n-1)) : 0.5)*plotW;
    const py = v => PAD.t + plotH - (v/maxVal)*plotH;
    const series = hasDual
      ? [[d1, col1, 'Entrate', data.map(d=>d.lbl1)], [d2, col2, 'Spese', data.map(d=>d.lbl2)]]
      : [[d2, col2, g.filtroValore||'Importo', data.map(d=>d.lbl2)]];
    series.forEach(([vals, col, lbl, lbls]) => {
      const pts = vals.map((v,i)=>`${px(i)},${py(v)}`).join(' ');
      svgContent += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>`;
      const area = `M ${px(0)},${PAD.t+plotH} ${vals.map((v,i)=>`L ${px(i)},${py(v)}`).join(' ')} L ${px(n-1)},${PAD.t+plotH} Z`;
      svgContent += `<path d="${area}" fill="${col}" opacity=".07"/>`;
      vals.forEach((v,i) => {
        svgContent += `<circle cx="${px(i)}" cy="${py(v)}" r="3.5" fill="${col}"><title>${lbls[i]}</title></circle>`;
        if (showLabels && v > 0) svgContent += `<text x="${px(i)}" y="${py(v)-5}" text-anchor="middle" font-size="9" fill="${col}" font-family="DM Sans,sans-serif">${fmtK(v)}</text>`;
      });
    });
    MESI_SHORT.forEach((m,i) => { svgContent += `<text x="${px(i)}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--axis)" font-family="DM Sans,sans-serif">${m}</text>`; });
  } else {
    const gW = plotW/n, bW = Math.max(gW*.37, 3);
    data.forEach((d,i) => {
      const xB = PAD.l + i*gW + gW*.07;
      if (hasDual) {
        [[d.v1||0, col1, d.lbl1], [d.v2||0, col2, d.lbl2]].forEach(([v, col, lbl], j) => {
          if (v <= 0) return;
          const bH = (v/maxVal)*plotH, y = PAD.t+plotH-bH, x = xB+j*(bW+2);
          svgContent += `<rect x="${x}" y="${y}" width="${bW}" height="${bH}" fill="${col}" rx="2" opacity=".85"><title>${lbl}</title></rect>`;
          if (showLabels && bH > 14) svgContent += `<text x="${x+bW/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="${col}" font-family="DM Sans,sans-serif">${fmtK(v)}</text>`;
        });
      } else {
        const v = d.v2||0;
        if (v > 0) {
          const bH = (v/maxVal)*plotH, y = PAD.t+plotH-bH;
          svgContent += `<rect x="${xB}" y="${y}" width="${gW*.86}" height="${bH}" fill="${col2}" rx="2" opacity=".85"><title>${d.lbl2}</title></rect>`;
          if (showLabels && bH > 14) svgContent += `<text x="${xB+gW*.43}" y="${y-3}" text-anchor="middle" font-size="9" fill="${col2}" font-family="DM Sans,sans-serif">${fmtK(v)}</text>`;
        }
      }
      svgContent += `<text x="${PAD.l+i*gW+gW/2}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--axis)" font-family="DM Sans,sans-serif">${MESI_SHORT[i]}</text>`;
    });
  }

  // Moving average on d2
  const ma = d2.map((v,i) => { const sl=d2.slice(Math.max(0,i-2),i+1); return sl.reduce((a,b)=>a+b,0)/sl.length; });
  const pxM = monthlyTipo==='linee'
    ? (i => PAD.l + (n>1 ? (i/(n-1)) : 0.5)*plotW)
    : (i => PAD.l + i*(plotW/n) + (plotW/n)/2);
  const pyM = v => PAD.t + plotH - (v/maxVal)*plotH;
  const maLine = ma.map((v,i)=>`${pxM(i)},${pyM(v)}`).join(' ');
  svgContent += `<polyline points="${maLine}" fill="none" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"><title>Media mobile 3 mesi</title></polyline>`;
  leg += `<span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:14px;height:2px;background:var(--axis);border-top:2px dashed var(--axis)"></span>Media 3m</span>`;
  leg += '</div>';

  document.getElementById('chart-labels').innerHTML = '';
  document.getElementById('chart-monthly').innerHTML = leg + `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">${svgContent}</svg>`;
}

function onChartFilterChange() {
  const tipo = document.getElementById('dash-filtro-tipo')?.value || 'totale';
  const valoreEl = document.getElementById('dash-filtro-valore');
  if (!valoreEl) return;
  if (tipo === 'gruppo') {
    valoreEl.innerHTML = Object.keys(DB.global.categorie?.SPESE||{}).map(g=>`<option value="${g}">${g}</option>`).join('');
    valoreEl.style.display='';
  } else if (tipo === 'categoria') {
    valoreEl.innerHTML = allCategorie('SPESE').map(c=>`<option value="${c}">${c}</option>`).join('');
    valoreEl.style.display='';
  } else {
    valoreEl.style.display='none';
  }
  DB.global.personalizzazioni.grafico.filtroTipo = tipo;
  DB.global.personalizzazioni.grafico.filtroValore = tipo !== 'totale' ? (valoreEl.value||'') : '';
  autoSave();
  renderMonthlyChart();
}

function initChartFilter() {
  const g = DB.global.personalizzazioni?.grafico || {};
  const tipoEl = document.getElementById('dash-filtro-tipo');
  const valoreEl = document.getElementById('dash-filtro-valore');
  if (!tipoEl || !valoreEl) return;
  tipoEl.value = g.filtroTipo || 'totale';
  if (g.filtroTipo === 'gruppo') {
    valoreEl.innerHTML = Object.keys(DB.global.categorie?.SPESE||{}).map(gr=>`<option value="${gr}" ${gr===g.filtroValore?'selected':''}>${gr}</option>`).join('');
    valoreEl.style.display='';
  } else if (g.filtroTipo === 'categoria') {
    valoreEl.innerHTML = allCategorie('SPESE').map(c=>`<option value="${c}" ${c===g.filtroValore?'selected':''}>${c}</option>`).join('');
    valoreEl.style.display='';
  }
}

function renderDashboard() {
  const at = annualTotals();
  const risparmio = at.reddito - at.spese - at.debiti;
  const V = DB.global.valuta;
  document.getElementById('dash-title').textContent = 'Dashboard ' + annoAttivo;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi reddito"><label>${icona('briefcase',16)} Entrate totali</label><div class="val">${V} ${fmt(at.reddito)}</div><div class="sub">Anno ${annoAttivo}</div></div>
    <div class="kpi spese"><label>${icona('banknote',16)} Uscite totali</label><div class="val">${V} ${fmt(at.spese+at.debiti)}</div><div class="sub">Spese + Debiti</div></div>
    <div class="kpi kpi-hero ${risparmio>=0?'investimenti':'spese'}"><label>${icona('piggy',16)} Risparmio netto</label><div class="val">${risparmio>=0?'+':''}${V} ${fmt(Math.abs(risparmio))}</div><div class="sub">${risparmio>=0?icona('check',14)+' Positivo':icona('alert',14)+' Negativo'}</div></div>
    <div class="kpi kpi-wide investimenti"><label>${icona('report',16)} Investimenti</label><div class="val">${V} ${fmt(at.investOut)}</div><div class="sub">Versato nell'anno</div></div>`;

  initChartFilter();
  renderMonthlyChart();

  const gruppi={};
  txAnno().filter(t=>t.tipo==='SPESE'&&txConfirmed(t)).forEach(t=>{txSplits(t).forEach(s=>{const g=getGruppoSpesa(s.categoria);gruppi[g]=(gruppi[g]||0)+s.importo;});});
  const entries=Object.entries(gruppi).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const total=entries.reduce((s,[,v])=>s+v,0)||1;
  const maxGruppo=entries[0]?.[1]||1;
  let donutHtml='';
  if (!entries.length) { donutHtml='<p style="color:var(--text2);font-size:13px;text-align:center;padding:20px">Nessuna spesa</p>'; }
  else { entries.forEach(([g,v])=>{
    const col=getGruppoColore(g);
    donutHtml+=`<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="font-weight:500">${g}</span><span style="color:${col};font-weight:600">${V} ${fmt(v)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/maxGruppo*100).toFixed(1)}%;background:${col}"></div></div>
      <div style="font-size:10px;color:var(--text2);margin-top:1px">${(v/total*100).toFixed(1)}%</div>
    </div>`;
  }); }
  document.getElementById('chart-donut').innerHTML=donutHtml;

  const cats={};
  txAnno().filter(t=>t.tipo==='SPESE'&&txConfirmed(t)).forEach(t=>{txSplits(t).forEach(s=>{cats[s.categoria]=(cats[s.categoria]||0)+s.importo;});});
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat=topCats[0]?.[1]||1;
  document.getElementById('chart-top-cat').innerHTML=topCats.map(([c,v])=>`<div class="bar-row"><div class="bar-label">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100).toFixed(1)}%;background:var(--spese)"></div></div><div class="bar-value">${V} ${fmt(v)}</div></div>`).join('')||'<p style="color:var(--text2)">Nessun dato</p>';

  const mesePat=Math.min(selectedMese,12);
  const contiPat=getConti();
  const patData=contiPat.map(c=>{const sb=calcSaldoConto(c.nome,mesePat);return{nome:c.nome,icona:c.icona,col:coloreLeggibile(c.colore)||'var(--reddito)',val:sb.inserito??sb.calcolato};});
  const patPos=patData.filter(d=>d.val>0);
  const totPat=patPos.reduce((s,d)=>s+d.val,0)||1;
  // Donut SVG
  const DW=130,R=48,ir=28,cx=DW/2,cy=DW/2;
  let svgPaths='',start=-Math.PI/2;
  patPos.forEach(d=>{
    const frac=d.val/totPat,angle=Math.max(frac*Math.PI*2,0.01),end=start+angle;
    const x1o=cx+R*Math.cos(start),y1o=cy+R*Math.sin(start),x2o=cx+R*Math.cos(end),y2o=cy+R*Math.sin(end);
    const x1i=cx+ir*Math.cos(end),y1i=cy+ir*Math.sin(end),x2i=cx+ir*Math.cos(start),y2i=cy+ir*Math.sin(start);
    const lg=angle>Math.PI?1:0;
    svgPaths+=`<path d="M ${x1o} ${y1o} A ${R} ${R} 0 ${lg} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${ir} ${ir} 0 ${lg} 0 ${x2i} ${y2i} Z" fill="${d.col}" opacity=".9"><title>${d.nome}: ${V} ${fmt(d.val)} (${(frac*100).toFixed(1)}%)</title></path>`;
    start=end;
  });
  const patLegend=patPos.map(d=>`<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${d.col};flex-shrink:0"></span><span style="font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.icona} ${d.nome}</span><span style="font-size:10px;font-weight:600;color:${d.col}">${(d.val/totPat*100).toFixed(1)}%</span></div>`).join('');
  const patCards=patData.map(d=>`<div style="padding:8px 10px;background:var(--row);border-radius:8px;border-left:3px solid ${d.col}"><div style="font-size:11px;color:var(--text2);margin-bottom:3px">${d.icona} ${d.nome}</div><div style="font-size:16px;font-weight:600;color:${d.col}">${V} ${fmt(d.val)}</div></div>`).join('');
  document.getElementById('patrimonio-box').innerHTML=`<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
    <div style="flex-shrink:0;text-align:center"><svg viewBox="0 0 ${DW} ${DW}" style="width:${DW}px;height:${DW}px;display:block">${svgPaths}</svg><div style="margin-top:6px">${patLegend}</div></div>
    <div style="flex:1;min-width:120px;display:grid;grid-template-columns:1fr 1fr;gap:6px">${patCards}</div>
  </div>`;

  document.getElementById('saldi-head').innerHTML=`<tr><th>Mese</th><th style="text-align:right">Entrate</th><th style="text-align:right">Spese</th><th style="text-align:right">Debiti</th><th style="text-align:right">Saldo ${getConti()[0]?.nome||'Banca'}</th><th style="text-align:right">Risparmio</th></tr>`;
  const mainConto=getConti()[0]?.nome||'Banca';
  let sbody='';
  for(let m=1;m<=12;m++){
    const mt=monthlyTotals(m);
    const sb=calcSaldoConto(mainConto,m);
    if(!txAnno().some(t=>t.mese===m)) continue;
    const risp=mt.reddito-mt.spese-mt.debiti;
    sbody+=`<tr><td><strong>${MESI[m-1]}</strong></td><td class="td-num amt-in">${V} ${fmt(mt.reddito)}</td><td class="td-num amt-out">${V} ${fmt(mt.spese)}</td><td class="td-num amt-debt">${V} ${fmt(mt.debiti)}</td><td class="td-num">${V} ${fmt(sb.inserito??sb.calcolato)}</td><td class="td-num ${risp>=0?'amt-in':'amt-out'}">${risp>=0?'+':''}${V} ${fmt(Math.abs(risp))}</td></tr>`;
  }
  document.getElementById('saldi-body').innerHTML=sbody||'<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text2)">Nessun dato per questo anno</td></tr>';
}

// INIT
initDB();
renderNavUser();
document.querySelector(`[data-page="${PAGE_ID}"]`).classList.add('active');
updateAnnoUI();
renderDashboard();
</script>
</body>
</html>
