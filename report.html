<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — Finanze Personali</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="tema.js"></script>
<script src="icone.js"></script>
<link rel="stylesheet" href="report.css">
</head>
<body>

<script src="shell.js"></script>

<main id="main">
  <div class="page-header">
    <h2>Report</h2>
    <p>Analisi di un periodo a tua scelta, con confronto</p>
  </div>
  <div class="rp">
    <div class="bar-top">
      <div class="trow" id="trow" role="tablist" aria-label="Schede del report"></div>
      <div class="prow" id="prow"></div>
    </div>
    <div id="view" role="tabpanel"></div>
  </div>
</main>

<div id="confirm-backdrop">
  <div id="confirm-box">
    <h4 id="confirm-title">Conferma</h4>
    <p id="confirm-msg"></p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="confirmReject()">Annulla</button>
      <button class="btn btn-danger" id="confirm-ok-btn" onclick="confirmAccept()">Elimina</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>

<script src="db.js"></script>
<script src="report.js"></script>
<script>
const PAGE_ID = 'report';

function renderCurrentPage() { renderReport(); }

initDB();
renderNavUser();
document.querySelector(`[data-page="${PAGE_ID}"]`).classList.add('active');
updateAnnoUI();
reportInit();
</script>
</body>
</html>
